services:
  # ---------- Config Server ----------
  configsvr:
    image: mongo:7.0
    container_name: configsvr
    command: --configsvr --replSet configReplSet --port 27017 --bind_ip_all
    ports:
      - 27017:27017
    volumes:
      - configsvr:/data/db
    networks:
      - mongo-cluster

  # ---------- Shard 1 (Replica Set: primario + secundario) ----------
  shard1:
    image: mongo:7.0
    container_name: shard1
    command: --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all
    ports:
      - 27018:27018
    volumes:
      - shard1:/data/db
    networks:
      - mongo-cluster

  shard1-secundario:
    image: mongo:7.0
    container_name: shard1-secundario
    command: --shardsvr --replSet shard1ReplSet --port 27022 --bind_ip_all
    ports:
      - 27022:27022
    volumes:
      - shard1-secundario:/data/db
    networks:
      - mongo-cluster

  # ---------- Shard 2 ----------
  shard2:
    image: mongo:7.0
    container_name: shard2
    command: --shardsvr --replSet shard2ReplSet --port 27019 --bind_ip_all
    ports:
      - 27019:27019
    volumes:
      - shard2:/data/db
    networks:
      - mongo-cluster

  # ---------- Shard 3 ----------
  shard3:
    image: mongo:7.0
    container_name: shard3
    command: --shardsvr --replSet shard3ReplSet --port 27020 --bind_ip_all
    ports:
      - 27020:27020
    volumes:
      - shard3:/data/db
    networks:
      - mongo-cluster

  # ---------- Router (mongos) ----------
  mongos:
    image: mongo:7.0
    container_name: mongos
    depends_on:
      - configsvr
      - shard1
      - shard1-secundario
      - shard2
      - shard3
    command: mongos --configdb configReplSet/configsvr:27017 --bind_ip_all --port 27021
    ports:
      - 27021:27021
    restart: on-failure
    networks:
      - mongo-cluster

volumes:
  configsvr:
  shard1:
  shard1-secundario:
  shard2:
  shard3:

networks:
  mongo-cluster:
    driver: bridge